name: Auto Score

on:
  schedule:
    - cron: '1 17 * * *'   # 每天北京时间01:01启动，随后随机等待至01:00-03:00内执行
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run script
      env:
        MUSIC_U: ${{ secrets.MUSIC_U }}
        CSRF: ${{ secrets.CSRF }}
        NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        WAIT_TIME_MIN: ${{ secrets.WAIT_TIME_MIN }}
        WAIT_TIME_MAX: ${{ secrets.WAIT_TIME_MAX }}
        SCORE: ${{ secrets.SCORE }}
        FULL_EXTRA_TASKS: ${{ secrets.FULL_EXTRA_TASKS }}
      run: |
        # 手动运行立即执行；仅定时任务在北京时间01:00-03:00随机等待
        if [[ "${{ github.event_name }}" == "schedule" ]]; then
          today=$(TZ=Asia/Shanghai date +%F)
          window_start=$(TZ=Asia/Shanghai date -d "$today 01:00:00" +%s)
          window_end=$(TZ=Asia/Shanghai date -d "$today 03:00:00" +%s)
          now=$(date +%s)
          if (( now >= window_end )); then
            echo "已超过北京时间03:00，跳过本次定时评分，避免在指定时间段外执行。"
            exit 0
          fi
          min_delay=$((window_start > now ? window_start - now : 0))
          max_delay=$((window_end - now - 1))
          delay=$(shuf -i "$min_delay-$max_delay" -n 1)
          target_time=$(TZ=Asia/Shanghai date -d "@$((now + delay))" '+%F %T')
          echo "将在北京时间 $target_time 执行评分，随机等待 $delay 秒。"
          sleep "$delay"
        fi
        python main.py
