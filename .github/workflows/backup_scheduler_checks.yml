name: Backup Scheduler Checks

on:
  push:
    branches: [main]
    paths:
      - 'backup-scheduler/**'
      - '.github/workflows/auto_score.yml'
      - '.github/workflows/backup_scheduler_checks.yml'
      - 'main.py'
      - 'src/core/**'
      - 'tests/test_daily_guard.py'
      - 'tests/test_scoring_result.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install requests pycryptodome
      - name: Verify daily guard and scoring result handling (no live scoring)
        run: python -m unittest tests.test_daily_guard tests.test_scoring_result
      - name: Verify Worker behavior (mocked GitHub API)
        run: node --test backup-scheduler/worker.test.mjs
